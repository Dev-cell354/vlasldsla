</head><body><div class="container"><img src="logo-omnimun.svg" alt="Omnimun logo" class="auth-logo"><h1>Create Account</h1><p>Join Omnimun AI workspace.</p><div id="error" role="alert"></div><form id="registerForm"><label for="username">Username</label><input id="username" type="text" placeholder="3–32 characters" autocomplete="username" minlength="3" maxlength="32" required><label for="email">Email Gmail</label><input id="email" type="email" placeholder="your@gmail.com" autocomplete="email" maxlength="254" required><label for="password">Password</label><input id="password" type="password" placeholder="Create password (8–128 characters)" autocomplete="new-password" minlength="8" maxlength="128" required><label for="confirm">Confirm Password</label><input id="confirm" type="password" placeholder="Repeat password" autocomplete="new-password" minlength="8" maxlength="128" required><button type="submit">Create Account</button></form><div class="link">Already have an account? <a href="login.html">Sign in</a></div></div><div class="brand">Made by Orthera</div>
<script>
'use strict';
const $=id=>document.getElementById(id),form=$('registerForm'),submit=form.querySelector('[type=submit]');let busy=false;
document.querySelectorAll('input[type=password]').forEach(input=>{const b=document.createElement('button');b.type='button';b.textContent='Show';b.style.marginBottom='10px';b.onclick=()=>{input.type=input.type==='password'?'text':'password';b.textContent=input.type==='password'?'Show':'Hide'};input.after(b)});
form.addEventListener('submit',async e=>{e.preventDefault();if(busy||!form.reportValidity())return;$('error').textContent='';const username=$('username').value.trim(),email=$('email').value.trim().toLowerCase(),password=$('password').value;let validation='';if(!/^[^@\s]+@gmail\.com$/.test(email))validation='Please use a Gmail address';else if(username.length<3||username.length>32)validation='Username must be between 3 and 32 characters';else if(password.length<8)validation='Password minimal 8 karakter';else if(password!==$('confirm').value)validation='Passwords do not match';if(validation){$('error').textContent=validation;return}busy=true;submit.disabled=true;const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),60000);try{const res=await fetch('/api/register',{method:'POST',credentials:'same-origin',signal:controller.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({username,email,password})}),data=await res.json().catch(()=>{throw Error('Invalid server response')});if(!res.ok||!data.success)throw Error(data.error||'Registration failed');try{localStorage.setItem('verifyEmail',email);localStorage.setItem('verifyResendAt',String(Date.now()+(Number(data.resendAfterSeconds)||60)*1000))}catch{}location.href='/verify.html?email='+encodeURIComponent(email)}catch(err){$('error').textContent=err.name==='AbortError'?'Request timed out. Please try again.':err.message}finally{clearTimeout(timer);busy=false;submit.disabled=false;delete form.dataset.processing}});
</script></body></html>
