t{color:#bbb!important;font-size:12px!important}#verifyHint a{color:#fff;font-weight:700}.link{text-align:center;margin-top:23px;color:#888;font-size:12px}.link a{color:#fff;font-weight:700;text-decoration:none}.link a:hover{text-decoration:underline}.brand{position:fixed;right:28px;bottom:22px;color:#777;font-size:9px;letter-spacing:2px;text-transform:uppercase}.auth-logo{display:block;width:170px;max-width:100%;max-height:55px;object-fit:contain;object-position:left center;margin:0 0 30px;filter:none}.auth-logo.small{width:155px}.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:45px;margin-top:10px;padding:10px 14px;border:1px solid #383838;border-radius:12px;background:#141414;color:#eee;font-size:13px;font-weight:600;box-shadow:none}.google-btn:hover{background:#202020;border-color:#555}.google-btn img{width:18px;height:18px;flex:0 0 18px;object-fit:contain}input+button[type=button]{display:inline-flex;align-items:center;justify-content:center;width:auto;min-height:28px;margin:-9px 0 15px;padding:5px 10px;border:1px solid #383838;border-radius:8px;background:#151515;color:#aaa;font-size:10px;font-weight:600}input+button[type=button]:hover{background:#242424;color:#fff;transform:none}form button[type=submit]{margin-top:2px}#verifyHint a{margin-left:4px}@media(max-width:520px){body{padding:18px 14px}body:before{inset:8px;border-radius:18px}.container{padding:30px 23px;border-radius:20px}h1{font-size:29px}.auth-logo{margin-bottom:24px}.brand{right:18px;bottom:13px;font-size:8px}}

</head><body><div class="container"><img src="logo-omnimun.svg" alt="Omnimun logo" class="auth-logo small"><h1>Verify Email</h1><p>Enter the code sent to your Gmail.</p><div id="message" class="message" role="status"></div><label for="email">Email</label><input id="email" type="email" placeholder="your@gmail.com" autocomplete="email" required maxlength="254"><button type="button" id="sendCode" class="secondary">Resend verification code</button><label for="code">Verification Code</label><input id="code" type="text" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" placeholder="123456" required><button type="button" id="verify">Verify Email</button></div>
<script>
'use strict';
const $=id=>document.getElementById(id),send=$('sendCode'),verify=$('verify');let sending=false,verifying=false,until=0,tick=null;
try{
 $('email').value=new URLSearchParams(location.search).get('email')||localStorage.getItem('verifyEmail')||'';
 const savedResendAt=Number(localStorage.getItem('verifyResendAt')||0);
 if(savedResendAt>Date.now())startCooldown(Math.ceil((savedResendAt-Date.now())/1000));
 else localStorage.removeItem('verifyResendAt');
}catch{}
function message(text,ok=false){$('message').className='message '+(ok?'success':'error');$('message').textContent=text}
function email(){if(!$('email').reportValidity())throw Error('Enter a valid email.');return $('email').value.trim().toLowerCase()}
async function post(url,body){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),60000);try{const res=await fetch(url,{method:'POST',credentials:'same-origin',signal:controller.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),data=await res.json().catch(()=>{throw Error('Invalid server response')});if(!res.ok||!data.success)throw Error(data.error||'Request failed');return data}catch(e){throw Error(e.name==='AbortError'?'Request timed out. Please try again.':e.message)}finally{clearTimeout(timer)}}
function cooldown(){const seconds=Math.max(0,Math.ceil((until-Date.now())/1000));send.disabled=sending||seconds>0;send.textContent=seconds?'Resend available in '+seconds+'s':'Resend verification code';if(!seconds){clearInterval(tick);tick=null}}
function startCooldown(seconds){until=Date.now()+Math.max(0,seconds)*1000;clearInterval(tick);tick=setInterval(cooldown,250);cooldown()}
function retrySeconds(text){const seconds=String(text).match(/wait\s+(\d+)\s+seconds?/i);if(seconds)return Number(seconds[1]);const minutes=String(text).match(/wait\s+(\d+)\s+minutes?/i);return minutes?Number(minutes[1])*60:0}
send.onclick=async()=>{if(sending||Date.now()<until)return;sending=true;send.disabled=true;try{const data=await post('/api/send-code',{email:email()});message(data.message||'Verification code sent.',true);const seconds=Number(data.resendAfterSeconds)||60;startCooldown(seconds);try{localStorage.setItem('verifyResendAt',String(Date.now()+seconds*1000))}catch{}}catch(e){message(e.message);const wait=Number(e.resendAfterSeconds)||retrySeconds(e.message);if(wait){startCooldown(wait);try{localStorage.setItem('verifyResendAt',String(Date.now()+wait*1000))}catch{}}}finally{sending=false;cooldown()}};
verify.onclick=async()=>{if(verifying)return;verifying=true;verify.disabled=true;try{const address=email(),code=$('code').value.trim();if(!/^\d{6}$/.test(code))throw Error('Enter the 6-digit verification code.');await post('/api/verify',{email:address,code});message('Email verified. Redirecting...',true);try{localStorage.removeItem('verifyEmail');localStorage.removeItem('verifyResendAt')}catch{}location.href='/login.html'}catch(e){message(e.message)}finally{verifying=false;verify.disabled=false}};
$('email').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();if(!e.repeat)send.click()}});
$('code').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();if(!e.repeat)verify.click()}});
</script></body></html>
